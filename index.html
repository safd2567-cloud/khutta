<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خُطّة — Khutta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F5F1; --panel:#FFFFFF; --ink:#16221D; --muted:#5B6560;
    --emerald:#1F6F5C; --emerald-dark:#153F35; --sand:#E7DCC5; --line:#DEDACC;
    --danger:#B4442E; --gold:#B7A369; --radius:14px;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121815; --panel:#1B2420; --ink:#EDEFEA; --muted:#9FAAA3;
      --emerald:#4FBF9F; --emerald-dark:#2E7A63; --sand:#3A362A; --line:#2C352F;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121815; --panel:#1B2420; --ink:#EDEFEA; --muted:#9FAAA3;
    --emerald:#4FBF9F; --emerald-dark:#2E7A63; --sand:#3A362A; --line:#2C352F;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); line-height:1.65;}
  body[dir="rtl"]{font-family:'IBM Plex Sans Arabic', sans-serif;}
  body[dir="ltr"]{font-family:'Inter', sans-serif;}
  h1,h2,h3,.num-font{font-family:'Tajawal', 'Inter', sans-serif;}
  .wrap{max-width:780px; margin:0 auto; padding:30px 18px 90px;}

  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; gap:10px;}
  .brand{font-family:'Tajawal','Inter',sans-serif; font-weight:900; font-size:20px; color:var(--emerald-dark);}
  .lang-switch{display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden;}
  .lang-switch button{
    border:none; background:transparent; padding:7px 16px; font-size:13px; font-weight:600; cursor:pointer; color:var(--muted);
  }
  .lang-switch button.active{background:var(--emerald); color:#fff;}

  header h1{font-size:clamp(24px,6vw,34px); font-weight:900; margin:0 0 8px; color:var(--emerald-dark);}
  header p{color:var(--muted); margin:0 0 26px; font-size:15.5px; max-width:58ch;}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:22px 22px 26px; margin-bottom:20px;}
  .section-title{font-size:19px; font-weight:900; margin:0 0 4px;}
  .section-sub{color:var(--muted); font-size:14px; margin:0 0 18px;}

  .income-row{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .income-row label{color:var(--muted); font-size:15px;}
  .income-row input[type=number]{
    font-family:'Tajawal','Inter', sans-serif; font-weight:900; font-size:clamp(26px,7vw,38px);
    color:var(--emerald-dark); background:transparent; border:none; border-bottom:3px solid var(--line);
    width:200px; padding:4px 2px; outline:none;
  }
  .income-row input[type=number]:focus{border-color:var(--emerald);}
  .income-row input.currency{
    width:70px; font-size:16px; font-weight:600; color:var(--muted); border:1px solid var(--line);
    border-radius:8px; padding:6px 8px; background:var(--bg); text-align:center;
  }

  .alloc{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:22px;}
  @media(max-width:520px){.alloc{grid-template-columns:1fr;}}
  .alloc-item .top{display:flex; justify-content:space-between; margin-bottom:6px; font-size:14px;}
  .alloc-item .name{font-weight:600;}
  .alloc-item .val{color:var(--muted); font-weight:700; font-family:'Tajawal','Inter',sans-serif;}
  .alloc-item input{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--emerald-dark); font-size:20px; font-family:'Tajawal','Inter',sans-serif; font-weight:900; outline:none;}
  .alloc-item input:focus{border-color:var(--emerald);}
  .alloc-item small{color:var(--muted); display:block; margin-top:4px; font-size:12px;}
  .alloc-foot{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:16px; flex-wrap:wrap;}
  #alloc-status{font-size:13.5px; font-weight:600;}
  #alloc-status.ok{color:var(--emerald);} #alloc-status.warn{color:var(--danger);} #alloc-status.left{color:var(--muted);}
  .reset-btn{border:1px solid var(--emerald); color:var(--emerald); background:transparent; border-radius:999px; padding:7px 16px; font-size:13px; font-weight:600; cursor:pointer;}
  .sliders{display:flex; flex-direction:column; gap:18px; margin-top:22px;}
  .slider-item .top{display:flex; justify-content:space-between; margin-bottom:6px; font-size:14px;}
  .slider-item .top .name{font-weight:600;}
  .slider-item .top .val{color:var(--emerald-dark); font-weight:700; font-family:'Tajawal','Inter',sans-serif;}
  input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:8px; border-radius:6px; background:var(--line); outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--emerald); cursor:pointer; border:3px solid var(--panel); box-shadow:0 0 0 1px var(--emerald);}
  input[type=range]::-moz-range-thumb{width:22px; height:22px; border-radius:50%; background:var(--emerald); cursor:pointer; border:3px solid var(--panel); box-shadow:0 0 0 1px var(--emerald);}
  .slider-item small{color:var(--muted); display:block; margin-top:4px; font-size:12px;}
  #total-warning{color:var(--danger); font-size:13px; margin-top:14px; display:none; font-weight:600;}

  .bars{display:flex; height:32px; border-radius:10px; overflow:hidden; margin-top:22px; border:1px solid var(--line);}
  .bar-seg{transition:width .25s ease;}
  .breakdown{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-top:22px;}
  @media(max-width:480px){.breakdown{grid-template-columns:1fr;}}
  .bd-item{border-inline-start:4px solid var(--emerald); padding-inline-start:12px;}
  .bd-item .label{font-size:13px; color:var(--muted);}
  .bd-item .amount{font-family:'Tajawal','Inter',sans-serif; font-weight:900; font-size:21px;}

  .idea{border:1px solid var(--line); border-radius:12px; padding:15px 17px; margin-bottom:11px; display:flex; gap:13px; align-items:flex-start;}
  .idea .dot{width:9px; height:9px; border-radius:50%; background:var(--emerald); margin-top:8px; flex-shrink:0;}
  .idea h3{margin:0 0 4px; font-size:15.5px; font-weight:700;}
  .idea p{margin:0; color:var(--muted); font-size:13.8px;}

  .tips{list-style:none; margin:0; padding:0;}
  .tips li{padding:11px 0; border-bottom:1px solid var(--line); font-size:14.5px; display:flex; gap:9px;}
  .tips li:last-child{border-bottom:none;}
  .tips li::before{content:"—"; color:var(--emerald); font-weight:700; flex-shrink:0;}

  .disclaimer{background:var(--sand); border-radius:12px; padding:13px 15px; font-size:12.5px; color:var(--ink); margin-top:8px;}

  .mode-switch{display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;}
  .mode-switch button{
    flex:1; min-width:140px; border:1px solid var(--line); background:var(--bg); border-radius:10px;
    padding:11px 10px; font-size:13.5px; font-weight:600; cursor:pointer; color:var(--muted);
  }
  .mode-switch button.active{background:var(--emerald); color:#fff; border-color:var(--emerald);}

  .field-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:6px;}
  @media(max-width:480px){.field-grid{grid-template-columns:1fr;}}
  .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px;}
  .field input{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg);
    color:var(--ink); font-size:16px; font-family:'Tajawal','Inter',sans-serif; font-weight:700; outline:none;
  }
  .field input:focus{border-color:var(--emerald);}
  .field input:disabled{color:var(--emerald-dark); background:var(--sand); cursor:default; opacity:.9;}

  .goal-result{margin-top:20px; border-top:1px solid var(--line); padding-top:18px;}
  .goal-result .headline{font-size:15px; color:var(--muted); margin-bottom:6px;}
  .goal-result .big{font-family:'Tajawal','Inter',sans-serif; font-weight:900; font-size:clamp(24px,6vw,32px); color:var(--emerald-dark); margin-bottom:14px;}

  .progress-track{height:14px; border-radius:8px; background:var(--line); overflow:hidden; margin-bottom:6px;}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--gold), var(--emerald)); width:0%; transition:width .3s ease;}
  .progress-caption{font-size:12.5px; color:var(--muted); margin-bottom:16px;}

  .support-box{
    border-radius:12px; padding:15px 17px; font-size:14.5px; display:flex; gap:12px; align-items:flex-start;
    background:linear-gradient(135deg, rgba(31,111,92,0.08), rgba(183,163,105,0.12)); border:1px solid var(--line);
  }
  .support-box .spark{font-size:20px; line-height:1;}
  .support-box p{margin:0;}

  .lockable{position:relative;}
  .lockable.locked > *:not(.lock){filter:blur(7px); pointer-events:none; user-select:none;}
  .lock{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:20px; text-align:center; background:rgba(127,127,127,.12); border-radius:var(--radius); z-index:2;}
  .lock h3{margin:0; font-size:18px; font-weight:900;}
  .lock .price{font-family:'Tajawal','Inter',sans-serif; font-weight:900; font-size:22px; color:var(--emerald-dark);}
  .btn{display:inline-block; background:var(--emerald); color:#fff; border:none; border-radius:999px; padding:10px 22px; font-size:14px; font-weight:700; cursor:pointer; text-decoration:none;}
  .btn.ghost{background:transparent; color:var(--emerald); border:1px solid var(--emerald);}
  .code-row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
  .code-row input{padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--ink); font-size:16px; width:170px;}
  .lock small{color:var(--danger); min-height:1em;}
  #owner-fab{position:fixed; inset-inline-end:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); width:46px; height:46px; border-radius:50%; border:none; background:var(--emerald-dark); color:#fff; font-size:20px; cursor:pointer; z-index:20; box-shadow:0 2px 10px rgba(0,0,0,.25);}
  #owner-panel{position:fixed; inset-inline-end:16px; bottom:calc(72px + env(safe-area-inset-bottom,0px)); width:min(340px, calc(100vw - 32px)); background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; z-index:20; box-shadow:0 6px 24px rgba(0,0,0,.25); display:none; max-height:75vh; overflow:auto;}
  #owner-panel.open{display:block;}
  #owner-panel h3{margin:0 0 12px; font-size:16px;}
  #owner-panel label{display:block; font-size:12.5px; color:var(--muted); margin:10px 0 4px;}
  #owner-panel input[type=text], #owner-panel input[type=url]{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font-size:15px;}
  #owner-panel .row{display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600;}
  #owner-msg{font-size:12.5px; margin-top:10px; color:var(--muted);}
  .gate{position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(20,30,26,.55); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);}
  .gate-box{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:28px 24px; max-width:400px; width:100%; text-align:center; display:flex; flex-direction:column; gap:12px;}
  .gate-box h2{margin:0; font-size:21px; font-weight:900;}
  .gate-box .price{font-family:'Tajawal','Inter',sans-serif; font-weight:900; font-size:24px; color:var(--emerald-dark);}
  .gate-box p{margin:0; color:var(--muted); font-size:14px;}
  .gate-x{position:absolute; top:10px; inset-inline-end:12px; border:none; background:transparent; font-size:22px; cursor:pointer; color:var(--muted);}
  .banner{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; background:var(--sand); border-radius:10px; padding:9px 14px; font-size:13px; margin-bottom:16px;}
  .banner button{border:none; background:transparent; color:var(--emerald-dark); font-weight:700; cursor:pointer; text-decoration:underline; font-size:13px;}
  .wrap[inert]{pointer-events:none; user-select:none;}
  footer{text-align:center; color:var(--muted); font-size:12px; margin-top:28px;}
</style>
</head>

let lang = 'ar';
let mode = 'a';
const $ = id => document.getElementById(id);
const sliders = ['needs','wants','save','invest'];
const colors = {needs:'#1F6F5C', wants:'#4FA98A', save:'#B7A369', invest:'#8C5E2A'};

function fmt(n){ return Math.round(n).toLocaleString('en-US'); }

function setLang(l){
  lang = l;
  document.body.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = l;
  $('btn-ar').classList.toggle('active', l==='ar');
  $('btn-en').classList.toggle('active', l==='en');
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(T[l][key] !== undefined) el.textContent = T[l][key];
  });
  renderIncome();
  renderGoal();
  renderTips();
  renderGrowth();
  try{ buildLocks(); }catch(e){}
}

function setMode(m){
  mode = m;
  $('mode-a').classList.toggle('active', m==='a');
  $('mode-b').classList.toggle('active', m==='b');
  $('field-months').style.display = m==='a' ? '' : 'none';
  $('field-monthly').style.display = m==='b' ? '' : 'none';
  renderGoal();
}

const DEFAULT_SPLIT = {needs:50, wants:20, save:15, invest:15};
const amt = k => parseFloat($('a-'+k).value) || 0;

function autoSplit(){
  const income = parseFloat($('income').value) || 0;
  sliders.forEach(k=>{ $('a-'+k).value = Math.round(income*DEFAULT_SPLIT[k]/100); });
  renderIncome();
}

function renderIncome(){
  const income = parseFloat($('income').value) || 0;
  const cur = $('currency').value || '';
  const total = sliders.reduce((a,k)=>a+amt(k),0);
  const diff = Math.round(income - total);
  const st = $('alloc-status');
  if(diff === 0){ st.className='ok'; st.textContent = T[lang].allocOk(); }
  else if(diff > 0){ st.className='left'; st.textContent = T[lang].allocLeft(fmt(diff), cur); }
  else { st.className='warn'; st.textContent = T[lang].allocOver(fmt(-diff), cur); }

  sliders.forEach(k=>{ $('v-'+k).textContent = (income>0 ? Math.round(amt(k)/income*100) : 0) + '%'; });

  const bars = $('bars'); bars.innerHTML='';
  const base = Math.max(income, total, 1);
  sliders.forEach(k=>{
    const seg = document.createElement('div');
    seg.className='bar-seg'; seg.style.width = (amt(k)/base*100)+'%'; seg.style.background = colors[k];
    bars.appendChild(seg);
  });

  const investMonthly = amt('invest');
  renderIdeas(investMonthly, cur);
  renderGrowth(investMonthly, cur);
}

function renderGrowth(investMonthly, cur){
  if(investMonthly === undefined){
    investMonthly = amt('invest');
    cur = $('currency').value || '';
  }
  $('growth-monthly-display').value = fmt(investMonthly) + ' ' + cur;

  const annualRate = parseFloat($('growth-rate').value) || 0;
  const years = Math.max(1, parseFloat($('growth-years').value) || 1);
  const n = years * 12;
  const r = annualRate/100/12;
  const fv = r > 0 ? investMonthly * (((Math.pow(1+r, n) - 1)) / r) : investMonthly * n;
  const contributed = investMonthly * n;

  $('growth-headline').textContent = T[lang].growthHeadline;
  $('growth-big').textContent = fmt(fv) + ' ' + cur;
  $('growth-caption').textContent = T[lang].growthCaption(fmt(contributed), cur);
}

function renderIdeas(investAmount, cur){
  const box = $('ideas'); box.innerHTML='';
  const bank = T[lang].ideas;
  let tier;
  if(investAmount < 3000) tier = bank.tiny;
  else if(investAmount < 15000) tier = bank.small;
  else if(investAmount < 60000) tier = bank.mid;
  else tier = bank.big;
  tier.forEach(([title, desc])=>{
    const div = document.createElement('div');
    div.className='idea';
    div.innerHTML = `<div class="dot"></div><div><h3>${title}</h3><p>${desc}</p></div>`;
    box.appendChild(div);
  });
}

function renderTips(){
  const tipsList = $('tips'); tipsList.innerHTML='';
  T[lang].tips.forEach(t=>{
    const li = document.createElement('li'); li.textContent = t; tipsList.appendChild(li);
  });
}

function pickSupport(tier){
  const arr = T[lang].support[tier];
  return arr[Math.floor(Math.random()*arr.length)];
}

function renderGoal(){
  const target = parseFloat($('g-target').value) || 0;
  const existing = parseFloat($('g-existing').value) || 0;
  const remaining = Math.max(0, target - existing);
  const income = parseFloat($('income').value) || 0;
  const cur = $('currency').value || '';

  if(mode === 'a'){
    const months = Math.max(1, parseFloat($('g-months').value) || 1);
    const monthly = remaining / months;
    $('goal-headline').textContent = T[lang].goalHeadlineA;
    $('goal-big').textContent = fmt(monthly) + ' ' + cur + ' / ' + (lang==='ar' ? 'شهريًا' : 'mo');

    if(income > 0){
      const pct = Math.min(100, Math.round((monthly/income)*100));
      $('progress-fill').style.width = pct + '%';
      $('progress-caption').textContent = T[lang].progressCaption(pct);
      let tier = pct <= 15 ? 'easy' : (pct <= 35 ? 'moderate' : 'hard');
      $('support-msg').textContent = pickSupport(tier);
    } else {
      $('progress-fill').style.width = '0%';
      $('progress-caption').textContent = T[lang].progressCaptionNoIncome;
      $('support-msg').textContent = pickSupport('noIncome');
    }
  } else {
    const monthly = Math.max(1, parseFloat($('g-monthly').value) || 1);
    const months = Math.ceil(remaining / monthly);
    $('goal-headline').textContent = T[lang].goalHeadlineB;
    $('goal-big').textContent = T[lang].monthsUnit(months);

    if(income > 0){
      const pct = Math.min(100, Math.round((monthly/income)*100));
      $('progress-fill').style.width = pct + '%';
      $('progress-caption').textContent = T[lang].progressCaption(pct);
      let tier = pct <= 15 ? 'easy' : (pct <= 35 ? 'moderate' : 'hard');
      $('support-msg').textContent = pickSupport(tier);
    } else {
      $('progress-fill').style.width = '0%';
      $('progress-caption').textContent = T[lang].progressCaptionNoIncome;
      $('support-msg').textContent = pickSupport('noIncome');
    }
  }
}

sliders.forEach(k=>{ $('a-'+k).addEventListener('input', ()=>renderIncome()); });
$('income').addEventListener('input', ()=>{ autoSplit(); renderGoal(); });
$('currency').addEventListener('input', ()=>{ renderIncome(); renderGoal(); });
['g-target','g-existing','g-months','g-monthly'].forEach(id=>{
  $(id).addEventListener('input', renderGoal);
});
['growth-rate','growth-years'].forEach(id=>{
  $(id).addEventListener('input', ()=>renderGrowth());
});

autoSplit();
setLang('ar');
setMode('a');
renderIncome();
renderGoal();
renderGrowth();
// ===== Subscription / owner =====
const CFG = Object.freeze(JSON.parse(document.getElementById('cfg').textContent));
const CODES = new Set(JSON.parse(document.getElementById('codes').textContent));
const DAY = 864e5;
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
async function sha(t){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function h12(code){ return (await sha('khutta-v1' + code.toUpperCase().replace(/[^A-Z0-9]/g,''))).slice(0,12); }

let isOwner = false, usesNow = 0, tampered = false;

// Best-effort integrity check on stored subscription state. This can only catch
// obviously malformed data on THIS visitor's own device; it cannot detect or
// report tampering happening on someone else's device, since a published page
// can't send data to a remote server.
(function checkIntegrity(){
  const sub = store.get('khutta_sub');
  if(sub !== null){
    const valid = sub && typeof sub === 'object' && typeof sub.exp === 'number'
      && sub.exp <= Date.now() + CFG.days*DAY + DAY; // small grace margin
    if(!valid){ localStorage.removeItem('khutta_sub'); tampered = true; }
  }
  const used = store.get('khutta_used');
  if(used !== null && !Array.isArray(used)){ localStorage.removeItem('khutta_used'); tampered = true; }
  const uses = localStorage.getItem('khutta_uses');
  if(uses !== null && (!/^\d+$/.test(uses) || Number(uses) < 0)){ localStorage.removeItem('khutta_uses'); tampered = true; }
})();

(function countVisit(){
  let u = store.get('khutta_uses') || 0;
  let counted = false; try{ counted = sessionStorage.getItem('khutta_counted'); }catch(e){}
  if(!counted){ u++; store.set('khutta_uses', u); try{ sessionStorage.setItem('khutta_counted','1'); }catch(e){} }
  usesNow = u;
})();

function subStatus(){
  const sub = store.get('khutta_sub');
  if(sub && sub.exp > Date.now()) return {type:'sub', days:Math.ceil((sub.exp-Date.now())/DAY)};
  if(usesNow <= CFG.free) return {type:'free'};
  return {type:'locked'};
}

function openGate(dismissible){
  document.querySelectorAll('.gate').forEach(e=>e.remove());
  const t = T[lang];
  const g = document.createElement('div'); g.className='gate lock-ui';
  const wa = CFG.wa ? `https://wa.me/${CFG.wa}?text=${encodeURIComponent(t.waMsg)}` : '';
  g.innerHTML = `<div class="gate-box">${dismissible?'<button class="gate-x" type="button">×</button>':''}
    <h2>${dismissible ? t.activateLink : t.gateTitle}</h2>
    <div class="price">${t.planLine(CFG.price, CFG.days)}</div>
    <p>${t.gateSub}</p>
    ${wa ? `<a class="btn" href="${wa}" target="_blank" rel="noopener">${t.waBtn}</a>` : ''}
    <div class="code-row"><input type="text" placeholder="${t.codePh}" autocapitalize="characters" autocomplete="off"><button class="btn ghost" type="button">${t.unlockBtn}</button></div>
    <small style="color:var(--danger);min-height:1em"></small></div>`;
  const inp = g.querySelector('input'), btn = g.querySelector('.code-row button'), msg = g.querySelector('small');
  btn.onclick = async ()=>{
    if(!inp.value.trim()){ return; }
    const h = await h12(inp.value.trim());
    if(!CODES.has(h)){ msg.textContent = t.wrongCode; return; }
    const used = store.get('khutta_used') || [];
    if(used.includes(h)){ msg.textContent = t.usedCode; return; }
    used.push(h); store.set('khutta_used', used);
    store.set('khutta_sub', {exp: Date.now() + CFG.days*DAY});
    buildLocks();
  };
  if(dismissible) g.querySelector('.gate-x').onclick = ()=>g.remove();
  document.body.appendChild(g);
}

// Fully disables every control on the page outside the paywall gate itself,
// so a locked visitor can't type into or interact with anything underneath it.
function lockdown(active){
  const wrap = document.querySelector('.wrap');
  if(active){
    if(document.activeElement) document.activeElement.blur();
    wrap.setAttribute('inert','');
    wrap.style.filter = 'blur(3px)';
    wrap.querySelectorAll('input,button,select,textarea').forEach(el=>{
      if(!el.disabled){ el.disabled = true; el.dataset.lockedByGate = '1'; }
    });
  } else {
    wrap.removeAttribute('inert');
    wrap.style.filter = '';
    wrap.querySelectorAll('[data-locked-by-gate="1"]').forEach(el=>{
      el.disabled = false; delete el.dataset.lockedByGate;
    });
  }
}

function buildLocks(){
  document.querySelectorAll('.gate,.banner,.tamper-banner').forEach(e=>e.remove());
  if(!CFG.enabled || isOwner){ lockdown(false); return; }
  const st = subStatus(), t = T[lang];
  if(tampered){
    const tb = document.createElement('div'); tb.className='banner tamper-banner lock-ui';
    tb.style.background = 'var(--danger)'; tb.style.color = '#fff';
    tb.innerHTML = `<span>${t.tamperMsg}</span>`;
    document.querySelector('.wrap').insertBefore(tb, document.querySelector('.wrap').firstChild);
  }
  const b = document.createElement('div'); b.className='banner lock-ui';
  if(st.type==='sub'){ b.innerHTML = `<span>${t.subBanner(st.days)}</span>`; }
  else if(st.type==='free'){ b.innerHTML = `<span>${t.freeBanner(usesNow, CFG.free)}</span><button type="button">${t.activateLink}</button>`; b.querySelector('button').onclick = ()=>openGate(true); }
  const wrap = document.querySelector('.wrap'); if(b.innerHTML) wrap.insertBefore(b, wrap.firstChild);
  lockdown(st.type === 'locked');
  if(st.type==='locked') openGate(false);
}

async function initOwner(){
  let user=null; try{ user = await claude.use('user'); }catch(e){}
  isOwner = user ? await user.isOwner() : false;
  buildLocks();
  if(!isOwner) return;
  const t = ()=>T[lang];
  const q = v => String(v||'').replace(/"/g,'&quot;');
  const fab = document.createElement('button'); fab.id='owner-fab'; fab.textContent='⚙️'; fab.className='owner-ui';
  const panel = document.createElement('div'); panel.id='owner-panel'; panel.className='owner-ui';
  const render = ()=>{
    panel.innerHTML = `<h3>${t().ownerTitle}</h3>
      <div class="row"><input type="checkbox" id="o-prem" ${CFG.enabled?'checked':''}><label style="margin:0;font-size:14px;color:var(--ink)" for="o-prem">${t().ownerPremium}</label></div>
      <label>${t().ownerWa}</label><input type="text" id="o-wa" inputmode="numeric" value="${q(CFG.wa)}">
      <label>${t().ownerPrice}</label><input type="text" id="o-price" value="${q(CFG.price)}">
      <div style="margin-top:14px"><button class="btn" id="o-save" type="button">${t().ownerSave}</button></div><div id="owner-msg"></div>`;
    panel.querySelector('#o-save').onclick = save;
  };
  const save = async ()=>{
    const msg = panel.querySelector('#owner-msg'); msg.textContent = t().ownerSaving;
    const cfg = {
      enabled: panel.querySelector('#o-prem').checked,
      wa: panel.querySelector('#o-wa').value.replace(/\D/g,''),
      price: panel.querySelector('#o-price').value.trim() || CFG.price,
      free: CFG.free, days: CFG.days
    };
    try{
      const art = await claude.use('artifact');
      const clone = document.documentElement.cloneNode(true);
      clone.querySelector('#cfg').textContent = JSON.stringify(cfg);
      clone.querySelectorAll('.owner-ui,.lock-ui').forEach(e=>e.remove());
      await art.publish('<!DOCTYPE html>\n' + clone.outerHTML);
    }catch(e){ msg.textContent = t().ownerErr; }
  };
  fab.onclick = ()=>{ render(); panel.classList.toggle('open'); };
  document.body.append(fab, panel);
}
initOwner();
</script>
